# services.gradle.org 会 302 到 github.com/gradle/gradle-distributions（本机实测
# 504，GitHub releases 在国内不稳）。用国内镜像直连（range 206 已验证）。
# 换网络环境可改回 https://services.gradle.org/distributions/gradle-8.9-bin.zip
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://mirrors.huaweicloud.com/gradle/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
